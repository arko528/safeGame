<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safe Road Game</title>

    <style>
        body {
    text-align: center;
    font-family: Arial, sans-serif;
    background: skyblue;
}

h1 {
    margin-top: 20px;
}

.game {
    width: 900px;
    height: 300px;
    margin: 20px auto;
    overflow: hidden;
}

.road {
    width: 900px;
    height: 300px;
    background: #555;

    position: relative;

    border-top: 10px solid green;
    border-bottom: 10px solid green;
}

/* Player */

#player {
    position: absolute;

    left: 30px;
    bottom: 80px;

    font-size: 45px;

    transition: left 0.2s, bottom 0.2s;
}


/* Hole */

.hole {
    position: absolute;

    bottom: 75px;

    font-size: 40px;
}


/* Home */

#home {
    position: absolute;

    right: 20px;
    bottom: 65px;

    font-size: 60px;
}


/* Button */

button {
    padding: 10px 25px;

    font-size: 18px;

    cursor: pointer;
}
    </style>
</head>

<body>

    <h1>🏠 Safe Road Game</h1>

    <h3>Level: <span id="level">1</span></h3>

    <p>➡️ Right = Move &nbsp;&nbsp; ⬅️ Left = Move</p>
    <p>Space = Jump</p>

    <div class="game">

        <div class="road" id="road">

            <div id="player">🧍</div>

            <div id="home">🏠</div>

        </div>

    </div>

    <h2 id="message">Get Home Safely!</h2>

    <button onclick="restartGame()">Restart Game</button>

    <script>
        let level = 1;

let playerPosition = 30;

let jumping = false;

const homePosition = 800;


// ===============================
// Level অনুযায়ী Hole তৈরি
// ===============================

function createHoles() {

    const road = document.getElementById("road");

    // আগের hole মুছে ফেলবে
    const oldHoles = document.querySelectorAll(".hole");

    oldHoles.forEach(function(hole) {
        hole.remove();
    });


    // Level অনুযায়ী hole সংখ্যা
    let holeCount = level + 2;


    // নতুন hole তৈরি
    for (let i = 0; i < holeCount; i++) {

        let hole = document.createElement("div");

        hole.className = "hole";

        hole.innerText = "🕳️";


        // Hole-এর position
        let position = 180 + (i * 110);

        hole.style.left = position + "px";


        road.appendChild(hole);
    }
}


// ===============================
// Hole-এর position বের করা
// ===============================

function getHoles() {

    const holes = document.querySelectorAll(".hole");

    let holePositions = [];

    holes.forEach(function(hole) {

        holePositions.push(
            parseInt(hole.style.left)
        );

    });

    return holePositions;
}


// ===============================
// সামনে Hole আছে কিনা
// ===============================

function isHoleAhead() {

    let holes = getHoles();

    for (let i = 0; i < holes.length; i++) {

        if (
            playerPosition + 20 >= holes[i] &&
            playerPosition < holes[i] + 40
        ) {

            return true;
        }
    }

    return false;
}


// ===============================
// Player screen-এ দেখানো
// ===============================

function updatePlayer() {

    document.getElementById("player").style.left =
        playerPosition + "px";
}


// ===============================
// Jump
// ===============================

function jump() {

    if (jumping) {
        return;
    }

    jumping = true;

    let player =
        document.getElementById("player");


    player.style.bottom = "150px";


    setTimeout(function() {

        player.style.bottom = "80px";

        jumping = false;

    }, 500);
}


// ===============================
// সামনে যাওয়া
// ===============================

function moveRight() {

    if (playerPosition >= homePosition) {
        return;
    }


    // সামনে Hole আছে?
   if (isHoleAhead()) {

    document.getElementById("message").innerText =
        "💥 You fell into the hole!";

    setTimeout(function() {
        restartGame();
    }, 1000);

    return;
}


    // Hole না থাকলে সামনে যাবে
    playerPosition += 20;

    updatePlayer();

    checkWin();
}


// ===============================
// Hole পার হয়ে Jump
// ===============================

function jumpForward() {

    if (!isHoleAhead()) {

        return;
    }


    jump();


    // Hole পার হবে
    playerPosition += 60;

    updatePlayer();


    document.getElementById("message").innerText =
        "🔥 Great Jump! Keep Going!";


    checkWin();
}


// ===============================
// Level Complete
// ===============================

function checkWin() {

    if (playerPosition >= homePosition) {

        document.getElementById("message").innerText =
            "🎉 Level " + level + " Complete!";


        // একটু পরে নতুন Level
        setTimeout(function() {

            nextLevel();

        }, 1000);
    }
}


// ===============================
// পরের Level
// ===============================

function nextLevel() {

    // Level বাড়বে
    level++;


    // Player আবার শুরুতে
    playerPosition = 30;


    // Jump বন্ধ
    jumping = false;


    // Level screen update
    document.getElementById("level").innerText =
        level;


    document.getElementById("message").innerText =
        "Level " + level + " Started!";


    // নতুন Hole তৈরি
    createHoles();


    // Player update
    updatePlayer();
}


// ===============================
// Keyboard Control
// ===============================

document.addEventListener("keydown", function(event) {


    // Right Arrow
    if (event.key === "ArrowRight") {

        moveRight();
    }


    // Left Arrow
    if (event.key === "ArrowLeft") {

        if (playerPosition > 30) {

            playerPosition -= 20;

            updatePlayer();
        }
    }


    // Space
    if (event.key === " ") {

        jumpForward();
    }

});


// ===============================
// Restart
// ===============================

function restartGame() {

    level = 1;

    playerPosition = 30;

    jumping = false;


    document.getElementById("level").innerText =
        level;


    document.getElementById("message").innerText =
        "Get Home Safely!";


    createHoles();

    updatePlayer();
}


// ===============================
// Game শুরু
// ===============================

createHoles();

updatePlayer();
    </script>

</body>
</html>
